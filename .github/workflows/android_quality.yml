name: Android Quality & UI Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify VibeSync-only package references
        run: |
          legacy_a="com.omni"
          legacy_b="doc"
          legacy_pattern="$legacy_a$legacy_b"
          legacy_c="Omni"
          legacy_d="Doc"
          legacy_name="$legacy_c$legacy_d"
          matches="$(git grep -niE "$legacy_pattern|$legacy_name" -- android/app/src README.md PRIVACY_POLICY.md metadata.json package.json android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts || true)"
          if [ -n "$matches" ]; then
            echo "Forbidden legacy package/name references found in app/config files:"
            echo "$matches"
            exit 1
          fi

          bad_packages="$(git grep -nE "^package " -- android/app/src | grep -vE "package com\.vibesync(\.|$)" || true)"
          if [ -n "$bad_packages" ]; then
            echo "Non-VibeSync package declarations found:"
            echo "$bad_packages"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
          cache-disabled: true
      - name: Run unit tests
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

  ui-tests:
    name: Instrumented Compose UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
          cache-disabled: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests on Android 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: ./android
          script: |
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
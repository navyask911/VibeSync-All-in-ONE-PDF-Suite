name: Android Quality & UI Tests

on:
  push:
    branches: [ main, master, "fix/**", "hotfix/**", "playstore/**", "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify VibeSync-only package references
        run: |
          legacy_a="com.omni"
          legacy_b="doc"
          legacy_pattern="$legacy_a$legacy_b"
          legacy_c="Omni"
          legacy_d="Doc"
          legacy_name="$legacy_c$legacy_d"
          matches="$(git grep -niE "$legacy_pattern|$legacy_name" -- android/app/src README.md PRIVACY_POLICY.md metadata.json package.json android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts || true)"
          if [ -n "$matches" ]; then
            echo "Forbidden legacy package/name references found in app/config files:"
            echo "$matches"
            exit 1
          fi

          bad_packages="$(git grep -nE "^package " -- android/app/src | grep -vE "package com\.vibesync(\.|$)" || true)"
          if [ -n "$bad_packages" ]; then
            echo "Non-VibeSync package declarations found:"
            echo "$bad_packages"
            exit 1
          fi

      - name: Verify localized string resources
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          resource_root = pathlib.Path("android/app/src/main/res")
          base_path = resource_root / "values/strings.xml"
          locale_files = sorted(
              path for path in resource_root.glob("values*/strings.xml")
              if path != base_path
          )

          if not base_path.is_file():
              sys.exit("Default strings.xml is missing.")
          if len(locale_files) != 39:
              sys.exit(
                  f"Expected 39 translated locales, found {len(locale_files)}: "
                  f"{[str(path) for path in locale_files]}"
              )

          def load_strings(path):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  sys.exit(f"{path}: invalid XML: {exc}")

              items = {}
              duplicates = []
              for node in root.findall("string"):
                  name = node.attrib.get("name")
                  if not name:
                      sys.exit(f"{path}: found a <string> without a name attribute.")
                  if name in items:
                      duplicates.append(name)
                  items[name] = "".join(node.itertext())

              if duplicates:
                  sys.exit(f"{path}: duplicate string IDs: {sorted(set(duplicates))}")
              return items

          baseline = load_strings(base_path)
          if len(baseline) != 491:
              sys.exit(
                  f"Expected 491 default string IDs, found {len(baseline)}. "
                  "Review the baseline before changing the parity contract."
              )

          placeholder_pattern = re.compile(r"%(?:[0-9]+\$)?[a-zA-Z]")
          for path in locale_files:
              locale = path.parent.name
              localized = load_strings(path)
              missing = sorted(set(baseline) - set(localized))
              extra = sorted(set(localized) - set(baseline))
              if missing or extra:
                  sys.exit(
                      f"{locale}: strict localization parity failed; "
                      f"missing={missing}; extra={extra}"
                  )

              for name, source in baseline.items():
                  target = localized[name]
                  if not target.strip():
                      sys.exit(f"{locale}: empty translation for {name}")
                  source_args = sorted(placeholder_pattern.findall(source))
                  target_args = sorted(placeholder_pattern.findall(target))
                  if source_args != target_args:
                      sys.exit(
                          f"{locale}: placeholders differ for {name}: "
                          f"{source_args} != {target_args}"
                      )

          print(
              f"Strict localization parity passed: {len(baseline)} keys "
              f"across {len(locale_files)} locales (39/39); "
              "no missing, extra, duplicate, empty, or placeholder-mismatched strings."
          )
          PY

      - name: Verify PDF discovery uses SAF only
        run: |
          forbidden_manifest="$(grep -nE 'android[.]permission[.](MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_VISUAL_USER_SELECTED)' android/app/src/main/AndroidManifest.xml || true)"
          if [ -n "$forbidden_manifest" ]; then
            echo "Broad storage/media permissions are forbidden; PDF and image input must use SAF/system pickers:"
            echo "$forbidden_manifest"
            exit 1
          fi
          forbidden_code="$(git grep -nE 'DevicePdfScanner|isExternalStorageManager|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION|ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION' -- android/app/src/main/java android/app/src/main/AndroidManifest.xml || true)"
          if [ -n "$forbidden_code" ]; then
            echo "Legacy device-wide storage discovery or settings flow remains in source:"
            echo "$forbidden_code"
            exit 1
          fi

      - name: Verify OCR and print adapters stay on-device
        run: |
          forbidden_ocr="$(grep -RniE 'okhttp|retrofit|firebase|google-cloud|cloud-vision|https?://|java\.net\.URL|URL\(' android/app/src/main/java/com/vibesync/toolkit/pdf/data/ocr || true)"
          if [ -n "$forbidden_ocr" ]; then
            echo "Forbidden network/cloud integration found in the OCR and translation path:"
            echo "$forbidden_ocr"
            exit 1
          fi
          non_platform_print_imports="$(grep -RniE '^import ' android/app/src/main/java/com/vibesync/toolkit/pdf/data/print | grep -vF 'import android.print.' || true)"
          if [ -n "$non_platform_print_imports" ]; then
            echo "Print adapter must use only Android platform print imports:"
            echo "$non_platform_print_imports"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.13
          cache-disabled: true
      - name: Install Android 36 SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
      - name: Run unit tests
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          ./gradlew lintDebug --no-daemon --stacktrace

  ui-tests:
    name: Instrumented Compose UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.13
          cache-disabled: true
      - name: Install Android 36 SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests on Android 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: ./android
          script: |
            gradle wrapper --gradle-version 8.13 --distribution-type bin
            chmod +x gradlew
            bash -o pipefail -c './gradlew connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android/connected-debug-android-test.log"'

      - name: Verify connected test completion against JUnit reports
        if: always()
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          log_path = pathlib.Path("connected-debug-android-test.log")
          if not log_path.is_file():
              sys.exit("Instrumented test console log is missing; completion cannot be verified.")

          log = log_path.read_text(encoding="utf-8", errors="replace")
          starts = re.findall(r"Starting (\d+) tests on", log)
          finishes = re.findall(r"Finished (\d+) tests on", log)
          if not starts:
              sys.exit("No 'Starting N tests' line was captured from connectedDebugAndroidTest.")
          if not finishes:
              sys.exit("No 'Finished N tests' line was captured from connectedDebugAndroidTest.")
          if len(set(starts)) != 1 or len(set(finishes)) != 1:
              sys.exit(f"Inconsistent start/finish counts in test log: starts={starts}, finishes={finishes}.")

          started = int(starts[-1])
          finished = int(finishes[-1])
          if started < 50:
              sys.exit(f"Step 4 requires at least 50 connected Android tests; only {started} started.")
          report_dir = pathlib.Path("app/build/outputs/androidTest-results/connected/debug")
          report_files = sorted(report_dir.rglob("*.xml")) if report_dir.exists() else []
          if not report_files:
              sys.exit(f"No connected Android JUnit XML reports found under {report_dir}.")

          test_cases = []
          for path in report_files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  sys.exit(f"Could not parse instrumented test report {path}: {exc}")
              test_cases.extend(root.findall(".//testcase") if root.tag != "testcase" else [root])

          if not test_cases:
              sys.exit("Connected Android JUnit XML reports contain no test cases.")

          skipped = sum(1 for case in test_cases if case.find("skipped") is not None)
          failed = sum(
              len(case.findall("failure")) + len(case.findall("error"))
              for case in test_cases
          )
          actual = len(test_cases)
          print(f"Tests {actual}/{started} completed. ({skipped} skipped) ({failed} failed)")

          if started != finished:
              sys.exit(f"Connected test start/finish mismatch: started={started}, finished={finished}.")
          if actual != started:
              sys.exit(f"JUnit report count ({actual}) does not match the instrumented start count ({started}).")
          if skipped != 0:
              sys.exit(f"Instrumented test report contains {skipped} skipped test(s).")
          if failed != 0:
              sys.exit(f"Instrumented test report contains {failed} failed/error test(s).")
          print(f"Verified {actual} connected Android test cases against JUnit XML; 0 skipped, 0 failed.")
          PY
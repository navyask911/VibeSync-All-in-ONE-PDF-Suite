name: Android Quality & UI Tests

on:
  push:
    branches: [ main, master, "fix/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify VibeSync-only package references
        run: |
          legacy_a="com.omni"
          legacy_b="doc"
          legacy_pattern="$legacy_a$legacy_b"
          legacy_c="Omni"
          legacy_d="Doc"
          legacy_name="$legacy_c$legacy_d"
          matches="$(git grep -niE "$legacy_pattern|$legacy_name" -- android/app/src README.md PRIVACY_POLICY.md metadata.json package.json android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts || true)"
          if [ -n "$matches" ]; then
            echo "Forbidden legacy package/name references found in app/config files:"
            echo "$matches"
            exit 1
          fi

          bad_packages="$(git grep -nE "^package " -- android/app/src | grep -vE "package com\.vibesync(\.|$)" || true)"
          if [ -n "$bad_packages" ]; then
            echo "Non-VibeSync package declarations found:"
            echo "$bad_packages"
            exit 1
          fi

      - name: Verify localized string resources
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path("android/app/src/main/res")
          buckets = {
              "default": root / "values/strings.xml",
              "es": root / "values-es/strings.xml",
              "zh-CN": root / "values-zh-rCN/strings.xml",
              "hi": root / "values-hi/strings.xml",
              "ar": root / "values-ar/strings.xml",
              "bn": root / "values-bn/strings.xml",
              "pt": root / "values-pt/strings.xml",
              "ru": root / "values-ru/strings.xml",
              "ja": root / "values-ja/strings.xml",
              "fr": root / "values-fr/strings.xml",
              "de": root / "values-de/strings.xml",
              "id": root / "values-id/strings.xml",
              "ur": root / "values-ur/strings.xml",
              "tr": root / "values-tr/strings.xml",
              "ko": root / "values-ko/strings.xml",
              "it": root / "values-it/strings.xml",
          }
          parsed = {}
          for locale, path in buckets.items():
              nodes = ET.parse(path).getroot().findall("string")
              items = {}
              duplicates = []
              for node in nodes:
                  name = node.attrib["name"]
                  if name in items:
                      duplicates.append(name)
                  items[name] = "".join(node.itertext())
              if duplicates:
                  sys.exit(f"{locale}: duplicate string IDs: {sorted(set(duplicates))}")
              parsed[locale] = items

          baseline = parsed["default"]
          for locale, items in parsed.items():
              missing = sorted(set(baseline) - set(items))
              extra = sorted(set(items) - set(baseline))
              if missing or extra:
                  sys.exit(f"{locale}: missing={missing}; extra={extra}")
              for name, source in baseline.items():
                  source_args = sorted(re.findall(r"%(?:[0-9]+\$)?[a-zA-Z]", source))
                  target_args = sorted(re.findall(r"%(?:[0-9]+\$)?[a-zA-Z]", items[name]))
                  if source_args != target_args:
                      sys.exit(f"{locale}: placeholders differ for {name}: {source_args} != {target_args}")
          print(f"Localization resource audit passed: {len(baseline)} keys across {len(buckets)} established locales.")

          # Partial locales rely on base-resource fallbacks for existing keys. Require all new
          # profile keys, unique IDs and matching placeholders in every shipped strings bucket.
          required_profile_keys = [
              "resolution_profile_title",
              "resolution_profile_smallest",
              "resolution_profile_smallest_description",
              "resolution_profile_standard",
              "resolution_profile_standard_description",
              "resolution_profile_largest",
              "resolution_profile_largest_description",
              "resolution_profile_hd_auto",
              "resolution_profile_hd_auto_description",
              "resolution_profile_memory_fallback",
          ]
          required_filter_keys = [
              "scan_filter_title",
              "scan_filter_magic_color",
              "scan_filter_bw",
              "scan_filter_lighten",
              "scan_filter_no_shadow",
              "scan_filter_screen",
              "scan_filter_clean_marks",
          ]
          required_scan_keys = required_profile_keys + required_filter_keys
          all_string_files = sorted(root.glob("values*/strings.xml"))
          if root / "values/strings.xml" not in all_string_files:
              sys.exit("Base strings.xml was not found by the all-locale audit.")
          if len(all_string_files) != 40:
              sys.exit(f"Expected 40 strings.xml files, found {len(all_string_files)}: {[str(p) for p in all_string_files]}")

          base_nodes = ET.parse(root / "values/strings.xml").getroot().findall("string")
          base_items = {node.attrib["name"]: "".join(node.itertext()) for node in base_nodes}
          for path in all_string_files:
              locale = path.parent.name
              nodes = ET.parse(path).getroot().findall("string")
              items = {}
              for node in nodes:
                  name = node.attrib["name"]
                  if name in items:
                      sys.exit(f"{locale}: duplicate string ID: {name}")
                  items[name] = "".join(node.itertext())
              for name in required_scan_keys:
                  if name not in items:
                      sys.exit(f"{locale}: missing required profile string: {name}")
                  if name not in base_items:
                      sys.exit(f"default: required profile string missing: {name}")
                  source_args = sorted(re.findall(r"%(?:[0-9]+\$)?[a-zA-Z]", base_items[name]))
                  target_args = sorted(re.findall(r"%(?:[0-9]+\$)?[a-zA-Z]", items[name]))
                  if source_args != target_args:
                      sys.exit(f"{locale}: placeholders differ for {name}: {source_args} != {target_args}")
          print(f"All-locale resource audit passed: {len(required_profile_keys)} profile keys and {len(required_filter_keys)} filter keys across {len(all_string_files)} strings.xml files.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.13
          cache-disabled: true
      - name: Install Android 36 SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
      - name: Run unit tests
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          ./gradlew lintDebug --no-daemon --stacktrace

  ui-tests:
    name: Instrumented Compose UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.13
          cache-disabled: true
      - name: Install Android 36 SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests on Android 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: ./android
          script: |
            gradle wrapper --gradle-version 8.13 --distribution-type bin
            chmod +x gradlew
            set -o pipefail
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee connected-debug-android-test.log

      - name: Verify connected test completion against JUnit reports
        if: always()
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          log_path = pathlib.Path("connected-debug-android-test.log")
          if not log_path.is_file():
              sys.exit("Instrumented test console log is missing; completion cannot be verified.")

          log = log_path.read_text(encoding="utf-8", errors="replace")
          starts = re.findall(r"Starting (\\d+) tests on", log)
          finishes = re.findall(r"Finished (\\d+) tests on", log)
          if not starts:
              sys.exit("No 'Starting N tests' line was captured from connectedDebugAndroidTest.")
          if not finishes:
              sys.exit("No 'Finished N tests' line was captured from connectedDebugAndroidTest.")
          if len(set(starts)) != 1 or len(set(finishes)) != 1:
              sys.exit(f"Inconsistent start/finish counts in test log: starts={starts}, finishes={finishes}.")

          started = int(starts[-1])
          finished = int(finishes[-1])
          report_dir = pathlib.Path("app/build/outputs/androidTest-results/connected/debug")
          report_files = sorted(report_dir.rglob("*.xml")) if report_dir.exists() else []
          if not report_files:
              sys.exit(f"No connected Android JUnit XML reports found under {report_dir}.")

          test_cases = []
          for path in report_files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  sys.exit(f"Could not parse instrumented test report {path}: {exc}")
              test_cases.extend(root.findall(".//testcase") if root.tag != "testcase" else [root])

          if not test_cases:
              sys.exit("Connected Android JUnit XML reports contain no test cases.")

          skipped = sum(1 for case in test_cases if case.find("skipped") is not None)
          failed = sum(
              len(case.findall("failure")) + len(case.findall("error"))
              for case in test_cases
          )
          actual = len(test_cases)
          print(f"Tests {actual}/{started} completed. ({skipped} skipped) ({failed} failed)")

          if started != finished:
              sys.exit(f"Connected test start/finish mismatch: started={started}, finished={finished}.")
          if actual != started:
              sys.exit(f"JUnit report count ({actual}) does not match the instrumented start count ({started}).")
          if skipped != 0:
              sys.exit(f"Instrumented test report contains {skipped} skipped test(s).")
          if failed != 0:
              sys.exit(f"Instrumented test report contains {failed} failed/error test(s).")
          print(f"Verified {actual} connected Android test cases against JUnit XML; 0 skipped, 0 failed.")
          PY
- name: Build Signed AAB and APK
      working-directory: android
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        # Generate wrapper jar automatically if absent
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x gradlew
        ./gradlew :app:bundleRelease --no-daemon --stacktrace -x test -x lint
        ./gradlew :app:assembleRelease --no-daemon --stacktrace -x test -x lint

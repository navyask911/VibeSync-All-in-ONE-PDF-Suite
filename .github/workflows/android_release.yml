name: Build & Sign Android Release (AAB & APK)

on:
  push:
    branches: [ main, master, "fix/**", "hotfix/**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release Bundle & APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Bypass Broken GitHub Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-disabled: true
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Signing Keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 repository secret; a release upload keystore is required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release-upload.jks
          test -s app/release-upload.jks
          ls -lh app/release-upload.jks

      - name: Install Android 36 SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Build Signed AAB and APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          ./gradlew :app:lintDebug --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Android App Bundle metadata
        id: verify_aab
        working-directory: android
        run: |
          set -euo pipefail
          gradle_file="app/build.gradle.kts"
          expected_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' "$gradle_file" | head -n 1)"
          expected_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' "$gradle_file" | head -n 1)"
          expected_app_id="$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)"[[:space:]]*$/\1/p' "$gradle_file" | head -n 1)"
          test -n "$expected_code"
          test -n "$expected_name"
          test -n "$expected_app_id"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$aab" && test -s "$aab"
          bundletool="$RUNNER_TEMP/bundletool-all-1.17.2.jar"
          curl --fail --silent --show-error --location \
            "https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar" \
            --output "$bundletool"
          manifest="$(java -jar "$bundletool" dump manifest --bundle="$aab" --module=base)"
          printf '%s\n' "$manifest" | grep -F "android:versionCode=\"$expected_code\"" >/dev/null
          printf '%s\n' "$manifest" | grep -F "android:versionName=\"$expected_name\"" >/dev/null
          printf '%s\n' "$manifest" | grep -F "package=\"$expected_app_id\"" >/dev/null
          java -jar "$bundletool" validate --bundle="$aab"
          echo "Verified AAB package: $expected_app_id"
          echo "Verified AAB versionCode: $expected_code"
          echo "Verified AAB versionName: $expected_name"
          echo "version_name=$expected_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$expected_code" >> "$GITHUB_OUTPUT"
          {
            echo "## Verified Android release bundle"
            echo "- Application ID: $expected_app_id"
            echo "- versionName: $expected_name"
            echo "- versionCode: $expected_code"
            echo "- Artifact: $aab"
            echo "- Validation: bundletool metadata checks and bundle validation passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and stage Google Play symbols
        working-directory: android
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          native_symbols="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"

          test -s "$mapping"

          rm -rf play-symbols
          mkdir -p play-symbols
          cp "$mapping" play-symbols/mapping.txt

          if [ -s "$native_symbols" ]; then
            cp "$native_symbols" play-symbols/native-debug-symbols.zip
            native_status="Generated by Android Gradle Plugin with debugSymbolLevel=FULL."
          else
            native_status="No standalone native debug symbols were generated. The release contains dependency-native libraries whose debug metadata is already stripped; Android Gradle Plugin cannot reconstruct symbols that are not present in the dependency."
          fi

          {
            echo "VibeSync Google Play symbol package"
            release_version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
            release_version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
            echo "Release version: $release_version_name (versionCode $release_version_code)"
            echo "R8 mapping: present"
            echo "Native symbols: $native_status"
          } > play-symbols/native-debug-symbols-status.txt

          echo "Verified R8 mapping: $mapping"
          if [ -s "$native_symbols" ]; then
            echo "Verified native symbols: $native_symbols"
          else
            echo "Native symbol ZIP not available; continuing because no unstripped native symbols are available from dependencies."
          fi

      - name: Upload Google Play mapping and native symbols
        uses: actions/upload-artifact@v4
        with:
          name: VibeSync-GooglePlay-Symbols-v${{ steps.verify_aab.outputs.version_name }}-code${{ steps.verify_aab.outputs.version_code }}
          path: android/play-symbols/*
          if-no-files-found: error
          retention-days: 90

      - name: Secure Clean Keystore
        if: always()
        working-directory: android
        run: rm -f app/release-upload.jks

      - name: Verify signed release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$aab" && test -s "$aab"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          jarsigner -verify "$aab"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeSync-Installable-APK-v${{ steps.verify_aab.outputs.version_name }}-code${{ steps.verify_aab.outputs.version_code }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: VibeSync-GooglePlay-AAB-v${{ steps.verify_aab.outputs.version_name }}-code${{ steps.verify_aab.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

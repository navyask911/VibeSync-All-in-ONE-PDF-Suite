name: Build & Sign Android Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release Bundle & APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Bypass Broken GitHub Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-disabled: true
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Signing Keystore
        working-directory: android
        run: |
          mkdir -p app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > app/release-upload.jks
            ls -lh app/release-upload.jks
          fi

      - name: Install Android 36 SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Build Signed AAB and APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:bundleRelease --no-daemon --stacktrace -x test -x lint
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -x test -x lint

      - name: Verify and stage Google Play symbols
        working-directory: android
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          native_symbols="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"

          test -s "$mapping"

          rm -rf play-symbols
          mkdir -p play-symbols
          cp "$mapping" play-symbols/mapping.txt

          if [ -s "$native_symbols" ]; then
            cp "$native_symbols" play-symbols/native-debug-symbols.zip
            native_status="Generated by Android Gradle Plugin with debugSymbolLevel=FULL."
          else
            native_status="No standalone native debug symbols were generated. The release contains dependency-native libraries whose debug metadata is already stripped; Android Gradle Plugin cannot reconstruct symbols that are not present in the dependency."
          fi

          {
            echo "VibeSync Google Play symbol package"
            echo "Release version: 1.0.1 (versionCode 2)"
            echo "R8 mapping: present"
            echo "Native symbols: $native_status"
          } > play-symbols/native-debug-symbols-status.txt

          echo "Verified R8 mapping: $mapping"
          if [ -s "$native_symbols" ]; then
            echo "Verified native symbols: $native_symbols"
          else
            echo "Native symbol ZIP not available; continuing because no unstripped native symbols are available from dependencies."
          fi

      - name: Upload Google Play mapping and native symbols
        uses: actions/upload-artifact@v4
        with:
          name: VibeSync-GooglePlay-Symbols
          path: android/play-symbols/*
          if-no-files-found: error
          retention-days: 90

      - name: Secure Clean Keystore
        if: always()
        working-directory: android
        run: rm -f app/release-upload.jks

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeSync-Installable-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: VibeSync-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
